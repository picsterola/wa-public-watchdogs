name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monthly Top 5 refresh — first day of the month at 17:00 UTC.
    # Matches the cron set in the Perplexity session for the registry.
    - cron: '0 17 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check kill switch
        id: killswitch
        run: |
          if [ -f .OFFLINE ]; then
            echo "offline=true" >> "$GITHUB_OUTPUT"
            echo "::notice::.OFFLINE file present — publishing placeholder instead of full site."
          else
            echo "offline=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.killswitch.outputs.offline == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        if: steps.killswitch.outputs.offline == 'false'
        run: npm ci
      - name: Build
        if: steps.killswitch.outputs.offline == 'false'
        run: npm run build
      - name: Build offline placeholder
        if: steps.killswitch.outputs.offline == 'true'
        run: |
          mkdir -p dist
          cp .github/offline.html dist/index.html
          cp .github/offline.html dist/404.html
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
